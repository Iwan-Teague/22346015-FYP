[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false
# Source-available, noncommercial (docs/adr/0003-licence.md): free for any
# noncommercial use; commercial use needs a separate licence from the author.
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Iwan-Teague/rustyharness"

[workspace.dependencies]
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.100"
thiserror = "2.0.0"
# The ONE SHA-256 implementation (design §1.2, §1.4): RustCrypto, pure Rust,
# default features off (no alloc/oid; never the `asm` path).
sha2 = { version = "0.11.0", default-features = false }
# The regex engine of `harness.fs.search` (design §4.8; row H2e): the
# rust-lang crate, whose matching is linear in pattern × input (finite
# automata, no backtracking over the input), so a model-supplied pattern
# cannot make a search run away. Pure Rust, no build script, no C, MIT OR
# Apache-2.0. `perf-literal` is left out, so aho-corasick and memchr are not
# pulled in: the tree adds exactly regex, regex-automata and regex-syntax.
regex = { version = "1.12", default-features = false, features = ["std", "unicode", "perf-cache", "perf-dfa", "perf-onepass", "perf-backtrack", "perf-inline"] }
# The regex crate's parser, used directly for its TYPED errors: a bad
# pattern is reported to the model as a static harness message chosen by
# the error's kind, never as the parser's text (which quotes the pattern).
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode"] }
# The TLS stack of the web airlock's fetcher (design note `P-39-web-airlock`
# §5.4, slice P-39n): rustls with the ring provider and NO default features
# (never aws-lc-rs: no C toolchain on the build path). Optional everywhere;
# only harness-fetch's `net` feature turns it on.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# The web's public root store (§5.4): Mozilla's set as compiled data, so the
# fetcher never reads the system trust store.
webpki-roots = "1.0"
# Test-only (harness-fetch dev-deps): PEM loading for the static test CA and
# fixture leaves. PEM parsing is built in from 1.12 (the old feature knobs
# are gone), so this adds no feature surface.
rustls-pki-types = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# T2-A4 panic set, ratchet posture: warn + `-D warnings` in gates = denied
# outside test code; crate roots cfg_attr(test)-allow loose asserts in tests.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
