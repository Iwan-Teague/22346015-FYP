[package]
name = "harness-manifest"
description = "rustyharness capability manifest v1: strict parsing, content validation, trust tiers as data, the built-in manifest. Pure, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The shared strict JSON reader (harness_core::strict_json).
harness-core = { path = "../harness-core" }
# Pure-crate allowlist (design §1.2; scripts/ci/purity.sh): serde, serde_json,
# thiserror only. No SHA-256 or ed25519 crate yet: pinning and signing are
# H4, and this crate refuses tiers it cannot verify (see admission.rs).
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
