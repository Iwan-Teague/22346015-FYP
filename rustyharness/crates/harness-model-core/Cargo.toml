[package]
name = "harness-model-core"
description = "rustyharness model layer, pure half: messages, completions, endpoint rules, wire format, action protocols, profiles, context builder. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Pure-crate allowlist (scripts/ci/purity.sh): harness-core's tree,
# harness-manifest (tool definitions come from admitted capabilities), serde,
# serde_json, thiserror. Nothing that can open a socket or a file.
harness-core = { path = "../harness-core" }
harness-manifest = { path = "../harness-manifest" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
