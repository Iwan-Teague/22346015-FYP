name: ci

on:
  push:
  pull_request:

# Least privilege (AQ-97): read-only token; no job publishes or writes to the repo.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-deny
        # Installed from crates.io with --locked instead of a third-party
        # action (one less unverified supply-chain hop), matching the
        # fleet's rustychat CI posture.
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Supply-chain check (advisories, bans, sources)
        # licenses is intentionally omitted pending the OI-05 licence ruling.
        run: cargo deny check advisories bans sources
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
