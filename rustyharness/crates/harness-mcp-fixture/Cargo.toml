[package]
name = "harness-mcp-fixture"
description = "rustyharness fake MCP server: one binary, scripted ok and hostile modes for the MCP client's tests (P-37 design note §14). Test support only: nothing shipped depends on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "rh-mcp-fixture"
path = "src/main.rs"

[dependencies]
# P-37h: the provider's `McpConnector` seam. The fixture implements it for
# its in-memory connector ([`connector::InMemoryConnector`]): the fixture
# is a test double (unpublished, nothing shipped depends on it, not
# purity-scanned), so it may name the threads and channels the real
# confined connector (P-37l) will. The only crates.io dependency stays
# `serde_json` (P-37 design note §14).
serde_json.workspace = true
harness-mcp = { path = "../harness-mcp" }
# The witness type the `McpConnector` seam takes (accepted and ignored
# here: the fixture is in-process, nothing to confine).
harness-sandbox = { path = "../harness-sandbox" }

[dev-dependencies]
# P-37e: the client state machine's hostile-server suite lives here (this
# package hosts the fixture `serve` the tests drive AND the in-memory
# pipes the tests run it on). The client crate itself is purity-scanned
# whole (scripts/ci/purity.sh §2), so it may not name the pipes, the
# clock or a served session even in its tests; this package is not
# scanned.
# P-37h: the provider suite needs the same trick plus the policy/journal
# rig the other slices' tests use (a journaled authorized call is the
# only thing a provider accepts).
harness-core = { path = "../harness-core" }
# fault-injection: the test-only FaultFile/MemBlobs journal sinks (the
# purity gate refuses this feature on any normal edge).
harness-journal = { path = "../harness-journal", features = ["fault-injection"] }
harness-manifest = { path = "../harness-manifest" }
harness-policy = { path = "../harness-policy" }
harness-tools = { path = "../harness-tools" }
