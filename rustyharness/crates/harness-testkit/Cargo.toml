[package]
name = "harness-testkit"
description = "rustyharness dev-only test kit: temporary state-root fixtures, scripted models, audit assertions and an in-process CLI driver for the workspace's own tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The kit stitches the layers together, so it depends on every one of them.
harness-cli = { path = "../harness-cli" }
harness-core = { path = "../harness-core" }
harness-journal = { path = "../harness-journal" }
harness-manifest = { path = "../harness-manifest" }
harness-model = { path = "../harness-model" }
harness-policy = { path = "../harness-policy" }
harness-run = { path = "../harness-run" }
harness-sandbox = { path = "../harness-sandbox" }
# The hostile web fixtures (P-39k) run the fetcher library in process and
# report hop results through the provider's runner seam. Both crates are
# pure (no TLS, INV-52); the `remap`-gated test connector stays in the
# test crates, which enable that feature in their own dev-dependencies.
harness-fetch = { path = "../harness-fetch" }
harness-tools = { path = "../harness-tools" }
thiserror.workspace = true

[dev-dependencies]
gate-outcome = { path = "../gate-outcome" }
serde_json.workspace = true
