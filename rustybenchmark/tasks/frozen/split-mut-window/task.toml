schema = 1
id = "frozen/split-mut-window"
category = "borrow-lifetimes"
kind = "frozen"
answer_path = "src/lib.rs"
system_prompt = "You are an expert Rust programmer. Respond with a SINGLE ```rust code block containing the complete contents of src/lib.rs. No prose, no explanation, no other text."

# borrow-lifetimes is constraint-dominant (docs/04-categories.md): a solution
# that clones its way out is behaviourally correct but misses the point.
[weights]
behavior = 0.35
constraint = 0.55
quality = 0.10

[oracle]
behavior_test = "behavior"
differential_test = "differential"
alloc_test = "alloc"

# borrow-lifetimes: solving with `unsafe` pointer tricks sidesteps the very skill
# the task probes, so no unsafe is permitted (AST-checked, not grep).
[constraint]
max_unsafe = 0
forbidden_paths = []
