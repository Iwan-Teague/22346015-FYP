[package]
name = "harness-run"
description = "rustyharness run driver: session planning, the run loop, per-call journaling, audit replay and resume. The embedding API for apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Design §1.2: the driver depends on every layer below it.
gate-outcome = { path = "../gate-outcome" }
harness-core = { path = "../harness-core" }
harness-journal = { path = "../harness-journal" }
harness-manifest = { path = "../harness-manifest" }
harness-model = { path = "../harness-model" }
harness-policy = { path = "../harness-policy" }
harness-tools = { path = "../harness-tools" }
# The command runner's confinement (H2d): the run obtains a Conformed
# witness through the Confinement seam before it plans an exec grant.
harness-sandbox = { path = "../harness-sandbox" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The sealed JournalFile seam's fault-injecting file, for the INV-33 run test.
harness-journal = { path = "../harness-journal", features = ["fault-injection"] }
# The web airlock's test doors (P-39j): `net` so a test build can take the
# direct path at all (INV-52 stays: normal edges never enable it), `remap`
# so the fixed global test address dials a loopback fixture.
harness-sandbox = { path = "../harness-sandbox", features = ["net", "remap"] }
# Shared in-process test fixtures (P-03).
harness-testkit = { path = "../harness-testkit" }
# The hostile web suite (P-39k): forges `rh-fetch/1` frames for the lying
# fetcher and runs the fetcher library in process. Pure (INV-52); it never
# becomes a normal dependency.
harness-fetch = { path = "../harness-fetch" }
