[package]
name = "harness-journal"
description = "rustyharness run journal: per-attempt, hash-chained, append-only JSONL evidence with write-ahead intents and fail-closed poisoning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Test-only fault-injecting JournalFile/BlobSink (src/testing.rs). Enabled
# only through [dev-dependencies]; purity.sh refuses it on normal edges.
fault-injection = []

[dependencies]
# Not a pure crate (it owns files). The pure parts (canonical encoding, the
# hash chain, verification over bytes) live in `canon`, `conditions` and
# `reader::verify`, and take no I/O.
harness-core = { path = "../harness-core" }
gate-outcome = { path = "../gate-outcome" }
# Ident::from_capability: a capability id reaches a trusted field only from
# an admitted manifest's Capability (H1e-1 review NF-C).
harness-manifest = { path = "../harness-manifest" }
serde_json.workspace = true
thiserror.workspace = true
