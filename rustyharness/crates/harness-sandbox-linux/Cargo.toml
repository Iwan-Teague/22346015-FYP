[package]
name = "harness-sandbox-linux"
description = "rustyharness Linux confinement primitives: the fail-closed \"are the primitives present?\" decision of design §6.7 (slice S-La; the only crate allowed unsafe code, ratcheted by scripts/ci/purity.sh §5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# NOT [lints] workspace = true: the workspace lints table forbids
# `unsafe_code`, and a `[lints]` flag overrides a source `#![allow]`
# attribute, which would make this crate uncompilable. This is the ONE
# named unsafe exception (design §6.7, L-D1/L-D2); scripts/ci/purity.sh
# §5 checks the exception shape and ratchets the unsafe-site count.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[dependencies]

# The landlock crate pokes Linux-only libc items (prctl, O_PATH) and does
# not compile on other targets; the pure rule-planning layer of
# landlock_rules.rs must not need it, so it stays target-gated and the
# module's portable half compiles (and unit-tests) everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

# S-Le's live VM tests: this binary IS the supervisor's helper (it
# dispatches `__confine`, like supervisor_live), and the only place the
# probe runs for real. The dev-dependency carries the `linux-probe-row`
# gate: the UNCOMMITTED Linux matrix row, so `require()` can be exercised
# end to end before S-Lf commits the row. Not a registry dep: a path dep
# inside crates/, read whole by scripts/ci/purity.sh §2f/§5.
[[test]]
name = "probe_live"
harness = false

[target.'cfg(target_os = "linux")'.dev-dependencies]
harness-sandbox = { path = "../harness-sandbox", features = ["linux-probe-row"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"

# The supervisor's live tests are NOT libtest: the helper re-execs this very
# binary as `argv = [bin, "__confine", <spawner pid>]`, and libtest would
# swallow argv and try to run "__confine" as a test filter. The binary is
# dispatch-driven instead (see tests/supervisor_live.rs); on non-Linux hosts
# it builds to an empty main so the crate still tests everywhere.
[[test]]
name = "supervisor_live"
harness = false
