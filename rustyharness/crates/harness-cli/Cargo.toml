[package]
name = "harness-cli"
description = "The rustyharness command-line entrypoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rustyharness"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The CLI is a gate child (design §7.7): its last stdout line is a
# GateReport, so it needs gate-outcome's wire form.
gate-outcome = { path = "../gate-outcome", features = ["json"] }
# The `acp` verb's server (P-35): the ACP v1 stdio protocol.
harness-acp = { path = "../harness-acp" }
harness-core = { path = "../harness-core" }
harness-journal = { path = "../harness-journal" }
harness-manifest = { path = "../harness-manifest" }
# The MCP client/provider crate (design §6, P-37h): the CLI is the suite's
# composition root, and the purity gate's forwarding-witness selftest plants
# a `[features]` forward to harness-mcp/testing in THIS manifest, which
# cargo resolves only if harness-mcp is a direct dependency here.
harness-mcp = { path = "../harness-mcp" }
harness-model = { path = "../harness-model" }
harness-policy = { path = "../harness-policy" }
harness-run = { path = "../harness-run" }
harness-sandbox = { path = "../harness-sandbox" }
harness-tools = { path = "../harness-tools" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Shared in-process test fixtures (P-03).
harness-testkit = { path = "../harness-testkit" }
