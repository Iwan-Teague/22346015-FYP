[package]
name = "harness-mcp-fixture"
description = "rustyharness fake MCP server: one binary, scripted ok and hostile modes for the MCP client's tests (P-37 design note §14). Test support only: nothing shipped depends on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "rh-mcp-fixture"
path = "src/main.rs"

[dependencies]
# The only dependency (P-37 design note §14): the fixture is std +
# `serde_json`, so it cannot pull a runtime, a process API or anything else
# the purity gate has not reviewed into the test tree.
serde_json.workspace = true
