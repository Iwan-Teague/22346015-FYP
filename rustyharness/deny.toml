# cargo-deny configuration — rustyharness.
# Gate: `cargo deny check advisories bans licenses sources` (scripts/ci/gates.sh, CI).
# `licenses` is gated too: this project's licence is decided (docs/adr/0003-licence.md).

[graph]
all-features = true

[licenses]
version = 2
# The workspace's own crates are PolyForm-Noncommercial-1.0.0 (docs/adr/0003-licence.md);
# third-party dependencies must stay on permissive licences.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "PolyForm-Noncommercial-1.0.0"]
confidence-threshold = 1.0

[bans]
# Reviewed third-party crates beyond the serde and sha2 stacks, each also
# on scripts/ci/purity.sh's reviewed list with its reason:
#   regex, regex-automata, regex-syntax (H2e): the linear-time regex engine
#   of `harness.fs.search`; MIT OR Apache-2.0 (allowed above), pure Rust,
#   no build script, no FFI.
#   landlock, rustix, enumflags2 (design §6.7, slices S-Lb/S-Lc — admitted
#   here ahead of first use, by review): the Linux confinement primitives
#   behind harness-sandbox-linux, the ONE named unsafe crate (ratcheted by
#   scripts/ci/purity.sh §5b). Target-gated with it, so no other platform
#   pulls them; `rustix` is pinned to its libc backend (no build codegen —
#   L-Q2 open question, re-review at admission). No process APIs.
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies carry no version; they are not registry
# wildcards. Allowed only because every crate here is publish = false.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
ignore = []
