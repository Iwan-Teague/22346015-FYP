[package]
name = "harness-sandbox"
description = "rustyharness execution confinement (fail-closed: no containment, no execution) and host probes: filesystem locality, environment sample, through three fixed read-only system queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The direct egress door (§4.4, INV-52): without `net` the build has NO
# direct socket dialling at all — `open_hop` refuses `mode: direct` and
# `direct_egress_available()` reports it. The loopback pump and the
# user-proxy / search-endpoint doors work in every build.
net = []
# Test-only seam (the harness-journal sealed-seam pattern): exposes
# `RemapConnector`, which maps ONE fixed global address onto a loopback
# fixture. Nothing in the workspace enables it; purity.sh refuses any
# normal dependency edge that does.
remap = []
# S-Le's UNCOMMITTED Linux matrix row (linux-landlock-seccomp-nons-v1),
# behind a gate until S-Lf observes the probe green on a real Linux
# kernel; only then joins the committed MATRIX. The workspace never
# enables it in a release build; the probe's VM test binary does.
linux-probe-row = []

[dependencies]
# The environment probe measures for the vocabulary and pressure rule in
# harness-core (design §7.1: the probe here, the rule there).
harness-core = { path = "../harness-core" }
# The filesystem-locality probe measures for the pure decision in
# harness-policy (design §2.8: the probe here, the allowlist there); the
# egress airlock re-uses the §4.2 address classification.
harness-policy = { path = "../harness-policy" }
thiserror.workspace = true

# The Linux delegation (slice S-La, design §6.7): the workspace's one named
# `unsafe` crate, where the Landlock/seccomp primitives will live. Target-
# gated, so every other OS builds pull none of it. Not a registry dep: a
# path dep inside crates/, read whole by scripts/ci/purity.sh §2f/§5.
[target.'cfg(target_os = "linux")'.dependencies]
harness-sandbox-linux = { path = "../harness-sandbox-linux" }

[dev-dependencies]
# The fixture HTTP client for the egress pump tests (a workspace crate,
# not a new registry dependency; P-39g runs this same protocol over the
# pump).
harness-fetch = { path = "../harness-fetch" }
# S-Lf: the Linux conformance suite runs this crate's own spawn path, and
# the probe's witness hand-out (the uncommitted Linux row) is gated behind
# `linux-probe-row`. A dev-dependency on the crate itself turns the
# feature on for this crate's test builds only — the same sealed-seam
# pattern as harness-journal's `fault-injection` — so a release build (and
# every other workspace build) never has it.
harness-sandbox = { path = ".", features = ["linux-probe-row"] }

# The Linux conformance suite (S-Lf) is a `harness = false` binary: its
# `main()` is also the supervisor helper (re-exec'd with the `__confine`
# argument), which a libtest harness would swallow as test filters. It
# prints libtest-shaped tallies itself and serialises on one thread.
[[test]]
name = "conformance_linux"
harness = false
