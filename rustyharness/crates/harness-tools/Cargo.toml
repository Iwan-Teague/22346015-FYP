[package]
name = "harness-tools"
description = "rustyharness tool providers: the ToolProvider seam and the built-in read tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Design §1.2 edges: the ToolProvider seam (§4.5) takes only
# Journaled<Authorized<Call>>, so it names harness-journal and harness-policy.
harness-core = { path = "../harness-core" }
harness-journal = { path = "../harness-journal" }
harness-manifest = { path = "../harness-manifest" }
harness-policy = { path = "../harness-policy" }
# The command runner (H2d) starts every command through the sandbox's
# Confinement seam, with its Conformed witness (design §1.2 edge).
harness-sandbox = { path = "../harness-sandbox" }
# `harness.web.search` (P-39h) reuses the loopback endpoint rule for the
# user's SearXNG endpoint (P-39-web-airlock §8). A downward, acyclic edge;
# the design graph does not draw it (yet), noted in docs/slices/P-39h.md.
harness-model-core = { path = "../harness-model-core" }
# `harness.fs.search` with `regex: true` (H2e): linear-time matching, and
# the parser's typed errors for a bad pattern (workspace Cargo.toml says why).
regex.workspace = true
regex-syntax.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The sealed JournalFile seam's fault-injecting file, for the INV-33 test.
harness-journal = { path = "../harness-journal", features = ["fault-injection"] }
gate-outcome = { path = "../gate-outcome" }
# The in-process hop runner runs the fetcher library directly, in tests
# only (design §5.1: harness-tools never depends on harness-fetch except
# as a dev-dependency).
harness-fetch = { path = "../harness-fetch" }
